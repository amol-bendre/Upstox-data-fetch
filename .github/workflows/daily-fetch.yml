name: Daily Upstox Data Fetch

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Backfill target date (YYYY-MM-DD). Leave blank for today (IST). Applies to BOTH Nifty and options fetch.'
        required: false
        default: ''
      is_scheduled_run:
        description: 'Set to true by the relay for real daily runs. Leave false for manual/test runs (keeps Telegram silent).'
        required: false
        default: 'false'

jobs:
  nifty:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.fetch.outputs.available }}
      date: ${{ steps.fetch.outputs.date }}
      detail: ${{ steps.fetch.outputs.detail }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Nifty OHLC
        id: fetch
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: amol-bendre/stock-market-data
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python fetch_nifty_ohlc.py

  # Sequential, but NOT blocking: options job waits for nifty to finish
  # (needs: nifty) but still runs even if nifty failed (if: always()) --
  # the two pipelines are independent and one failing shouldn't skip
  # the other. Nifty runs first because it's fast (single instrument);
  # options is the long-running batch (~600 calls, several minutes).
  options:
    needs: nifty
    if: always()
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.fetch.outputs.available }}
      date: ${{ steps.fetch.outputs.date }}
      detail: ${{ steps.fetch.outputs.detail }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch options EOD OHLC
        id: fetch
        env:
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          DATA_REPO: amol-bendre/stock-market-data
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python fetch_options_ohlc.py

  # Combined Telegram message for both jobs. IS_LAST_ATTEMPT is now driven
  # by the explicit is_scheduled_run input rather than event_name, since
  # both real (relay-triggered) and manual/test runs arrive as
  # workflow_dispatch now that `schedule:` has been removed. The relay
  # sets is_scheduled_run=true on every real dispatch; manual runs from
  # the Actions tab default to false and stay silent, same as the
  # original schedule-vs-workflow_dispatch behavior this replaces.
  #
  # NOTE: this is still a single-attempt design -- the relay dispatches
  # this workflow at most once per day (its own marker-file dedupe
  # prevents a second dispatch even if pinged again within the window).
  # The dominant failure mode here (stale daily OAuth token) isn't fixed
  # by a same-evening retry regardless -- manual re-run after
  # re-authenticating remains the recovery path, unchanged from before.
  alert:
    needs: [nifty, options]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Telegram alert (combined)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IS_LAST_ATTEMPT: ${{ github.event.inputs.is_scheduled_run == 'true' }}
          JOB1_LABEL: "Nifty OHLC"
          JOB1_STATUS: ${{ needs.nifty.outputs.available == 'true' && 'success' || (needs.nifty.outputs.available == 'partial' && 'partial' || (needs.nifty.outputs.available == 'skipped' && 'success' || 'failure')) }}
          JOB1_DETAIL: ${{ needs.nifty.outputs.detail }}
          JOB1_DATE: ${{ needs.nifty.outputs.date }}
          JOB2_LABEL: "Options EOD OHLC"
          JOB2_STATUS: ${{ needs.options.outputs.available == 'true' && 'success' || (needs.options.outputs.available == 'partial' && 'partial' || (needs.options.outputs.available == 'skipped' && 'success' || 'failure')) }}
          JOB2_DETAIL: ${{ needs.options.outputs.detail }}
          JOB2_DATE: ${{ needs.options.outputs.date }}
        run: python telegram_alert.py
